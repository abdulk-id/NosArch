# Pre-commit hooks. Install with `mise exec -- pre-commit install`.

repos:
    - repo: local
      hooks:
          # Runs before ruff-format: lint fixes can leave code that the formatter then rewrites.
          - id: ruff-check
            name: ruff check --fix
            entry: ruff check --fix
            language: system
            types_or: [python]
          - id: ruff-format
            name: ruff format
            entry: ruff format
            language: system
            types_or: [python]
