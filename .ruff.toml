exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]


fix = true
indent-width = 4
line-length = 120

target-version = "py310"

[format]
docstring-code-format = true

indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = true

[lint]
# - A subset of the pycodestyle (`E`) codes
# - Pyflakes (`F`)
# - Flake8-tidy-imports (`TID`)
select = ["E4", "E7", "E9", "F", "TID"]
ignore = []

fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[lint.isort]
force-sort-within-sections = false
from-first = false
lines-after-imports = 1
no-sections = false
