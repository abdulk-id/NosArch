[tools]
ruff = "latest"
pre-commit = "latest"

# === Tasks ===
[tasks.setup]
description = "Set up the development environment"
run = ["mise install", "pre-commit install"]

# Formatting ===
[tasks.lint]
description = "Report Ruff violations"
run = "ruff check ."

[tasks.format]
description = "Apply Ruff's lint fixes and formatting"
run = "ruff check --fix . && ruff format ."

# Coding ---
[tasks.config-schema]
description = "Generate `config.schema.json` from the config data classes"
run = "python3 utils/config_schema_generator.py"

# Tests ---
[tasks.test-all]
description = "Run all tests"
run = ["mise test-config"]

[tasks.test-config]
description = "Test config.schema.json match the config data classes"
run = "python3 tests/test_config_schema.py"

# Decman tasks ---
[tasks.dm-nochk]
# Allows running decman and skipping pre-checks with just `mise dm-nochk`.
# More flags such as `--dry-run` are to be added in front of `mise dm-nochk`.
description = "Run decman and skip pre-checks (add any flags in front of this)"
raw_args = true
env.NOSARCH_DECMAN_SKIP_CHECKS = 1
run = "sudo -E decman"
