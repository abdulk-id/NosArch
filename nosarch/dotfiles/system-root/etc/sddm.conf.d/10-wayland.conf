# Managed by NosArch
# Copied from Omarchy
# https://github.com/omacom/omarchy/blob/81fd2d23ca6e3462183a4dc8360de3113fa8d80c/etc/sddm.conf.d/10-wayland.conf

[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=start-hyprland -- --config /usr/share/sddm/hyprland.lua
# SDDM does not search subdirectories. NosArch sessions live here so the hyprland package's own
# desktop entry stays out of the menu.
SessionDir=/usr/share/wayland-sessions/nosarch
