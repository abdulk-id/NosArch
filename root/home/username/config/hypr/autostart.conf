### AUTOSTART ###

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = firefox

# exec-once = hyprpolkitagent - started with systemd
# exec-once = uwsm-app -- hyprpaper - started with systemd
# exec-once = uwsm-app -- waybar - started with systemd
# exec-once = vicinae server
# exec-once = walker --gapplication-service - started with systemd
# exec-once = uwsm-app -- hypridle - started with systemd
exec-once = uwsm-app -- swaync
exec-once = uwsm-app -- swayosd-server

# Set systemd vars
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all
