# Example windowrules that are useful
windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Vicinae
layerrule {
    name = vicinae-blur
    blur = on
    ignore_alpha = 0
    match:namespace = vicinae
}

# Zenity dialogs
windowrule {
    name = zenity-dialog-rules
    match:class = ^(zenity)$
    float = on
    center = on
    pin = on
    stay_focused = on
    border_size = 4
    rounding = 20
    # Zenity dialogs are rounded themselves, creating a gap at the corners, hence more rounding
    no_blur = on
    no_dim = on
    opaque = on
    no_vrr = on
}

## App-specific tweaks

# 1password
windowrule {
    name = 1password-rules
    match:class = ^(1[p|P]assword)$
    no_screen_share = on
    float = on
    center = on
    size = 875 600
}

# Bitwarden
windowrule {
    name = bitwarden-rules
    match:class = ^(Bitwarden)$
    no_screen_share = on
    float = on
    center = on
    size = 875 600
}

# Browsers
windowrule {
    name = chromium-based-browser-rules
    match:class = ((google-)?[cC]hrom(e|ium)|[bB]rave-browser|[mM]icrosoft-edge|Vivaldi-stable|[hH]elium)
    tile = on # Force chromium-based browsers into a tile to deal with --app bug
    opacity = 1.0 override 0.97 override # Subtle opacity change
}
windowrule {
    name = firefox-based-browser-rules
    match:class = ([fF]irefox|[zZ]en|[lL]ibrewolf)
    opacity = 1.0 override 0.97 override # Subtle opacity change
}
windowrule {
    name = browser-video-site-opacity-override
    match:initial_title = ((?i)(?:[a-z0-9-]+\.)*youtube\.com_/|app\.zoom\.us_/wc/home)
    opacity = 1.0 override 1.0 override # Some video sites should never have opacity applied to them
    content = video
}

# Picture-in-picture overlays
windowrule {
    name = picture-in-picture-rules
    match:title = (Picture[\s-]?in[\s-]?Picture)
    float = on
    pin = on
    size = 384 216
    keep_aspect_ratio = on
    border_size = 3
    opacity = 1.0 override 1.0 override
    #move = (monitor_w-window_w-25) (monitor_h*0.025) # Move to top-right corner of screen
    move = (monitor_w-window_w-25) (monitor_h-window_h-25) # Move to bottom-right corner of screen
    content = video
}

# Media windows
windowrule {
    name = media-windows-rules
    match:class = ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$
    opacity = 1.0 1.0 # No transparency on media windows
}

# DaVinci Resolve
windowrule {
    name = davinci-resolve-rules
    match:class = .*[Rr]esolve.*
    match:float = 1
    stay_focused = on # Focus floating DaVinci Resolve dialog windows
}

