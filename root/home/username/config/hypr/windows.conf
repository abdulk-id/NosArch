# QEMU
windowrule {
    name = qemu-rules
    match:class = qemu
    opacity = 1 1
}

# File-picker windows
windowrule {
    name = file-picker-windows-rules
    match:class = (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus)
    #match:title = ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*)
    match:title = ^(Open.*Files?|Open [Ff]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to (open|save).*|[Cc]hoose.*|Enter name of file to save to.*)
    float = on
    center = on
    size = 875 600
}

# Steam
windowrule {
    name = steam-rules
    match:class = steam
    float = on
    opacity = 1 1
    idle_inhibit = fullscreen
}
windowrule {
    name = also-steam-rules
    match:class = steam
    match:title = ^Steam$
    center = on
    size = 1100 700
}
windowrule {
    name = steam-friends-rules
    match:class = steam
    match:title = Friends List
    size = 460 800
}

# Define terminal tag to style them uniformly
windowrule {
    name = tag-terminal-windows
    match:class = (Alacritty|kitty|com.mitchellh.ghostty)
    tag = +terminal
}
# TODO: Removable?? No window rules tagging windows with 'terminal' tag

# Webcam overlay for screen recording
windowrule {
    name = webcom-overlay-rules
    match:title = WebcamOverlay
    float = on
    pin = on
    no_initial_focus = on
    no_dim = on
    move = (monitor_w-window_w-40) (monitor_h-window_h-40)
}

# LocalSend
windowrule {
    name = localsend-rules
    match:class = localsend
    float = on
    center = on
    size = 400 600
}

# Gear Lever
windowrule {
    name = float-gearlever
    match:class = it.mijorus.gearlever
    float = on
    center = on
    size = 600 600
}

# GNOME Calculator
windowrule {
    name = float-calculator
    match:class = org.gnome.Calculator
    float = on
    center = on
    size = 400 600
}

# GNOME Clocks
windowrule {
    name = float-clocks
    match:class = org.gnome.clocks
    float = on
    center = on
    size = 400 600
}
