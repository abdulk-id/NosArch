# Example windowrules that are useful
windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Layer rules
# blur
layerrule {
    name = vicinae-blur
    blur = on
    ignore_alpha = 0
    match:namespace = vicinae
}

## App-specific tweaks

# 1password
windowrule {
    name = 1password-rules
    match:class = ^(1[p|P]assword)$
    no_screen_share = on
    float = on
    center = on
    size = 875 600
    tag = +floating-window
}

# Bitwarden
windowrule {
    name = bitwarden-rules
    match:class = ^(Bitwarden)$
    no_screen_share = on
    float = on
    center = on
    size = 875 600
    tag = +floating-window
}

# Browsers
windowrule {
    name = chromium-based-browser-rules
    match:class = ((google-)?[cC]hrom(e|ium)|[bB]rave-browser|[mM]icrosoft-edge|Vivaldi-stable|helium)
    tile = on # Force chromium-based browsers into a tile to deal with --app bug
    opacity = 1.0 override 0.97 override # Subtle opacity change
}
windowrule {
    name = firefox-based-browser-rules
    match:class = ([fF]irefox|zen|librewolf)
    opacity = 1.0 override 0.97 override # Subtle opacity change
}
windowrule {
    name = browser-video-site-opacity-override
    match:initial_title = ((?i)(?:[a-z0-9-]+\.)*youtube\.com_/|app\.zoom\.us_/wc/home)
    opacity = 1.0 override 1.0 override # Some video sites should never have opacity applied to them
}

# Picture-in-picture overlays
windowrule {
    name = picture-in-picture-rules
    match:title = (Picture[\s-]?in[\s-]?Picture)
    float = on
    pin = on
    size = 600 338
    keep_aspect_ratio = on
    border_size = 3
    opacity = 1.0 override 1.0 override
    #move = (monitor_w-window_w-25) (monitor_h*0.025) # Move to top-right corner of screen
    move = (monitor_w-window_w-25) (monitor_h-window_h-25) # Move to bottom-right corner of screen
}

# Media windows
windowrule {
    name = media-windows-rules
    match:class = ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$
    opacity = 1.0 1.0 # No transparency on media windows
}

# DaVinci Resolve
windowrule {
    name = davinci-resolve-rules
    match:class = .*[Rr]esolve.*
    match:float = 1
    stay_focused = on # Focus floating DaVinci Resolve dialog windows
}

# Jetbrains
windowrule {
    # Fix splash screen showing in weird places and prevent annoying focus takeovers
    name = jetbrains-splash-rules
    match:class = ^(jetbrains-.*)$
    match:title = ^(splash)$
    match:float = 1
    tag = +jetbrains-splash
    center = on
    no_focus = on
    border_size = 0
}
windowrule {
    name = jetbrains-popup-rules
    match:class = ^(jetbrains-.*)
    match:title = ^()$
    match:float = 1
    tag = +jetbrains
    center = on # Center popups/find windows
    stay_focused = on # Enabling this makes it possible to provide input in popup dialogs (search window, new file, etc.)
    border_size = 0
    min_size = (monitor_w*0.5) (monitor_h*0.5)
}
windowrule {
    name = jetbrains-tooltips-rules
    match:class = ^(jetbrains-.*)$
    match:title = ^(win.*)$
    match:float = 1
    no_initial_focus = on # Disable window flicker when autocomplete or tooltips appear
}
